<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyecto · Urba Inmobiliaria</title>
<meta name="description" content="Proyecto de Urba Inmobiliaria en Cusco.">
<meta property="og:title" content="Proyecto · Urba Inmobiliaria">
<meta property="og:description" content="Proyecto de Urba Inmobiliaria en Cusco.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#282829">
<link rel="icon" href="/img/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">


<link rel="preload" href="/fonts/bonn-bf-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css?v=20261102j">
</head>
<body class="theme-amarillo">
<header class="site-header" data-site-header></header>
<main>

<div id="project"></div>
</main>
<footer class="site-footer" data-site-footer></footer>
<script src="/projects.js?v=20261102j"></script>
<script src="/site.js?v=20261102j"></script>
<script>
(function(){
const p = PROJECTS.find(x => x.slug === new URLSearchParams(location.search).get('p'));
const el = document.getElementById('project');
if (!p) { el.innerHTML = '<section class="page-head band"><div class="wrap"><h1 class="title">Proyecto no encontrado</h1><p><a class="btn" href="/proyectos.html">Ver proyectos</a></p></div></section>'; return; }
document.body.className = 'theme-' + projectColor(p, PROJECTS.indexOf(p));
if (window.urbaInk) urbaInk(projectColor(p, PROJECTS.indexOf(p)));
document.title = p.name + ' · ' + p.district + ' · Urba Inmobiliaria';
document.querySelector('meta[name=description]').content = p.intro;
const ficha = (p.ficha || [
  ['ubicacion', 'Ubicación', p.address || p.district],
  ['pisos', 'Pisos', p.floors],
  ['areas', 'Áreas', p.areas],
  ['dorm', 'Dormitorios', bedroomsText(p.bedrooms).replace(' dorm.', '')],
  ['entrega', 'Entrega', p.delivery],
  ['precio', 'Precio desde', p.priceFrom]
]).filter(f => f[2]);
const I = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const icons = {
  ubicacion: I('<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>'),
  pisos: I('<path d="M4 21h16M6 21V4h12v17M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2"/>'),
  areas: I('<path d="M4 4h16v16H4z"/><path d="M4 9h5V4M15 20v-5h5"/>'),
  dorm: I('<path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 15h18M6 10V7h5v3M13 10V7h5v3M3 18v2M21 18v2"/>'),
  entrega: I('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l2 2M18 5l2 2"/>'),
  precio: I('<path d="M3 12l9-9h8v8l-9 9z"/><circle cx="16" cy="8" r="1.5"/>'),
  uso: I('<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>')
};
const units = p.units || [];
const bedsSet = [...new Set(units.map(u => u.beds))].sort((x, y) => x - y);
const money = v => v ? 'US$ ' + Number(v).toLocaleString('en-US') : 'Consultar';
// One drawings viewer: building drawings (planImgs) and units share the same plate and index
const dwgs = (p.planImgs || []).map(x => ({ kind: 'dwg', title: x.title, img: x.img }));
// Lot subdivisions: every lot shares one map; the chosen lot is highlighted and the polygons are clickable
const lots = p.lots || [], lm = p.lotMap || {};
const items = [...dwgs, ...units.map(u => ({ kind: 'unit', u, img: u.plan })), ...lots.map(l => ({ kind: 'lot', l }))];
const idxRow = (it, i) => `<li><button type="button" class="ix" data-i="${i}"${it.kind === 'unit' ? ` data-beds="${it.u.beds}"` : ''}${i ? '' : ' aria-current="true"'}>${it.kind === 'lot' ? `<span class="sr">Lote </span>${esc(it.l.code)}` : esc(it.kind === 'dwg' ? it.title : it.u.code)}</button></li>`;
const mapHtml = (code) => `<div class="pl-plate pl-map" style="aspect-ratio:${lm.viewBox.split(' ')[2]}/${lm.viewBox.split(' ')[3]}"><svg viewBox="${lm.viewBox}" role="img" aria-label="Plano de lotes de ${esc(p.name)}">${(([x, y, w, h]) => `<image href="${esc(lm.img)}" x="${x}" y="${y}" width="${w}" height="${h}"/>`)(lm.viewBox.split(' '))}${lots.map((l, j) => lm.polys[l.code] ? `<polygon points="${lm.polys[l.code]}" data-j="${j}" class="${l.code === code ? 'on' : ''}${l.status ? ' st-' + esc(l.status) : ''}"><title>Lote ${esc(l.code)} · ${l.area} m²</title></polygon>` : '').join('')}</svg></div>`;
const plateHtml = (it) => it.kind === 'lot' ? mapHtml(it.l.code) : `<div class="pl-plate">${it.img ? `<img src="${esc(it.img)}" alt="${esc(it.kind === 'dwg' ? it.title : 'Plano del departamento ' + it.u.code)}">` : ''}</div>`;
const shareBtn = `<button type="button" class="btn-pill btn-pill-line pf-share">Compartir</button>`;
const specsHtml = (it) => {
  if (it.kind === 'dwg') return `<p class="pf-type">${esc(p.name)}</p><h3 class="pf-name">${esc(it.title)}</h3><div class="pf-btns">${p.plans ? `<a class="btn-pill btn-pill-dark" href="${esc(p.plans)}" download>Descargar planos</a>` : ''}${shareBtn}</div>`;
  if (it.kind === 'lot') { const l = it.l; const ST = { disponible: 'Disponible', separado: 'Separado', vendido: 'Vendido' };
    return `<p class="pf-type">${esc(p.name)}</p><h3 class="pf-name">Lote ${esc(l.code)}</h3>
    <dl class="pf-specs"><dt>Área</dt><dd>${l.area} m²</dd>${l.front ? `<dt>Frente</dt><dd>${l.front} m</dd>` : ''}${l.status ? `<dt>Estado</dt><dd>${ST[l.status] || esc(l.status)}</dd>` : ''}${l.status === 'vendido' ? '' : `<dt>Precio</dt><dd>${money(l.price)}</dd>`}</dl>
    <div class="pf-btns"><a class="btn-pill btn-pill-dark" data-wa="Hola, me interesa el lote ${esc(l.code)} de ${esc(p.name)} (${l.area} m²).">Contáctanos ↗</a>${shareBtn}</div>`; }
  const u = it.u;
  return `<p class="pf-type">${esc(u.type || 'Flat')} · ${esc(u.floorLabel || 'Piso ' + (u.floor ?? '—'))}</p><h3 class="pf-name">Departamento ${esc(u.code)}</h3>
    <dl class="pf-specs"><dt>Dormitorios</dt><dd>${u.beds}</dd><dt>Baños</dt><dd>${u.baths}</dd><dt>Área</dt><dd>${u.area} m²</dd>${done && !u.price ? '' : `<dt>Precio</dt><dd>${money(u.price)}</dd>`}</dl>
    <div class="pf-btns"><a class="btn-pill btn-pill-dark" data-wa="Hola, me interesa el departamento ${esc(u.code)} de ${esc(p.name)} (${u.area} m², ${u.beds} dorm.).">Contáctanos ↗</a>${shareBtn}</div>`;
};
const near = p.nearby || {};
const mapsQ = encodeURIComponent(p.mapQuery || p.address || '');
const kind = (p.kicker || '').split('·')[0].trim(), year = ((p.kicker || '').split('·')[1] || '').trim();
const sub = [kind, p.district].filter(Boolean).join(' · ') + (year ? ', ' + year : '');
const done = p.stage === 'entregado';
// Renders reel (Hugmun-style): three columns, each its own image set; click a column to step it, each auto-plays on its own
const SLOTS = 5, pad = (imgs) => [...imgs, ...Array(Math.max(0, SLOTS - imgs.length)).fill('')];
const reelGroups = (p.gallery || [
  { title: 'Exteriores', imgs: (p.spaces || []).filter(x => x.img).map(x => x.img) },
  { title: 'Áreas comunes', imgs: (p.amenities || []).map(a => a.img || ''), labels: (p.amenities || []).map(a => a.title) },
  { title: 'Interiores', imgs: [] }
]).map(g => ({ ...g, imgs: (g.imgs || []).filter(Boolean).slice(0, SLOTS) })).filter(g => g.imgs.length).slice(0, 3);   // no empty slots: only real images
const reelFrames = reelGroups;
function mountReel() {
  const box = document.getElementById('reel'); if (!box) return;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches, STEP = 5000;
  box.innerHTML = reelGroups.map((g, j) => `<figure class="reel-p" data-j="${j}" tabindex="0" role="button" aria-label="${esc(g.title)}: siguiente imagen">`
    + g.imgs.map((img, k) => img ? `<img class="${k ? '' : 'on'}" src="${esc(img)}" alt="${esc(g.title)}, ${esc(p.name)}" decoding="async">`
      : `<div class="reel-ph${k ? '' : ' on'}"><span>${esc((g.labels && g.labels[k]) || g.title)}<small>Imagen por completar</small></span></div>`).join('')
    + `<div class="reel-bars">${g.imgs.map((_, k) => `<i class="${k ? '' : 'run'}"></i>`).join('')}</div></figure>`).join('');
  box.querySelectorAll('.reel-p').forEach((fg, j) => {
    const slides = fg.querySelectorAll('img, .reel-ph'), bars = fg.querySelectorAll('.reel-bars i'); let k = 0, t = null;
    const set = (to) => { k = (to + slides.length) % slides.length;
      slides.forEach((x, i) => x.classList.toggle('on', i === k));
      bars.forEach((b, i) => { b.className = i < k ? 'on' : ''; if (i === k) { void b.offsetWidth; b.className = 'run'; } }); };
    const play = () => { clearTimeout(t); if (!still) t = setTimeout(() => { set(k + 1); play(); }, STEP); };
    fg.addEventListener('click', e => { const r = fg.getBoundingClientRect(); set(k + (e.clientX - r.left < r.width / 3 ? -1 : 1)); play(); });
    fg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); set(k + 1); play(); } if (e.key === 'ArrowLeft') { set(k - 1); play(); } });
    // stagger the columns so they don't all change at once
    bars[0].style.animationDuration = (STEP + j * 1600) / 1000 + 's';
    if (!still) t = setTimeout(() => { bars[0].style.animationDuration = ''; set(1); play(); }, STEP + j * 1600);
  });
}
el.innerHTML = `
  <section class="hero-photo">
    ${(p.pageHero || p.hero) ? `<picture><source media="(max-width:720px)" srcset="${esc(p.pageHero || p.heroMobile || p.hero)}"><img src="${esc(p.pageHero || p.hero)}" alt="${esc(p.name)}" fetchpriority="high"></picture>` : ''}
    <div class="hero-photo-text">
      <p class="hero-kicker">${esc(done ? 'Obra entregada' : STAGES[p.stage])}</p>
      <h1>${p.logo ? `<img class="hero-logo" src="${esc(p.logo)}" alt="${esc(p.name)}">` : esc(p.name)}</h1>
      <p class="hero-sub">${esc(sub)}</p>
      ${!done && (p.delivery || p.priceFrom || p.areas) ? `<p class="hero-keys">${[p.priceFrom && 'Desde ' + esc(p.priceFrom), bedroomsText(p.bedrooms) && esc(bedroomsText(p.bedrooms)), p.areas && esc(p.areas), p.delivery && 'Entrega ' + esc(p.delivery)].filter(Boolean).map(x => `<span>${x}</span>`).join('')}</p>` : ''}
      <div class="hero-actions"><a class="btn-pill" href="#contacto">${done ? 'Contáctanos' : 'Cotizar'}</a>${p.brochure ? `<a class="btn-pill btn-pill-ghost" href="${esc(p.brochure)}" download>Brochure</a>` : ''}<a class="btn-pill btn-pill-ghost" data-wa="Hola, quisiera información sobre ${esc(p.name)}.">WhatsApp</a></div>
    </div>
    <a class="scroll-cue" href="#proyecto">Descubre más<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
  </section>
  <section class="ficha-band" id="proyecto"><div class="wrap-wide">
    <p class="eyebrow">Ficha técnica</p>
    <ul class="ficha-list">${ficha.map(([k, t, v]) => `<li>${icons[k] || icons.uso}<span>${t}</span><strong>${v}</strong></li>`).join('')}</ul>
    ${(p.brochure || p.plans) ? `<div class="hero-actions left">${p.brochure ? `<a class="btn-pill btn-pill-dark" href="${esc(p.brochure)}" download>Descargar brochure</a>` : ''}${p.plans ? `<a class="btn-pill btn-pill-line" href="${esc(p.plans)}" download>Descargar planos</a>` : ''}</div>` : ''}
  </div></section>
  ${items.length ? `<section class="planos-g${lots.length ? ' pg-lots' : ''}" id="planos">
    <div class="pg-top">
      <div><p class="eyebrow">Planos</p><h2 class="title">${lots.length ? 'Elige tu lote' : units.length && !done ? 'Elige tu departamento' : 'Distribución'}</h2></div>
      <div class="pg-tabs-wrap">
        ${bedsSet.length > 1 ? `<div class="pf-filter" id="unit-filter"><button type="button" data-b="" aria-pressed="true">Todos</button>${bedsSet.map(b => `<button type="button" data-b="${b}">${b} dorm.</button>`).join('')}</div>` : ''}
        <ul class="pg-tabs">${items.map(idxRow).join('')}</ul>
      </div>
    </div>
    <div class="pg-body">
      <div class="pg-card unit-view" id="unit-view">${plateHtml(items[0])}</div>
      <div class="pg-info" id="pf-detail">${specsHtml(items[0])}</div>
    </div>
  </section>` : ''}
  ${reelFrames.length ? `<section class="reel" id="renders" aria-label="Renders y áreas comunes"><div class="reel-panels" id="reel"></div></section>` : ''}
  ${p.video ? `<section class="film" aria-label="Video de ${esc(p.name)}"><video controls playsinline preload="none" poster="${esc(p.videoPoster || '')}" src="${esc(p.video)}"></video></section>` : ''}
  ${p.mapQuery ? `<section class="near" id="ubicacion">
    <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa de ${esc(p.name)}" src="https://www.google.com/maps?q=${mapsQ}&output=embed"></iframe>
    <div class="near-panel">
      <p class="eyebrow">Ubicación</p>
      <h2 class="title">Cerca de la vida que te gusta.</h2>
      <p class="near-addr">${esc(p.address || p.mapQuery)}</p>
      <div class="near-btns"><a class="btn-pill" href="https://www.google.com/maps/search/?api=1&query=${mapsQ}" target="_blank" rel="noopener">Ver en Google Maps</a><a class="btn-pill btn-pill-accent" href="https://waze.com/ul?q=${mapsQ}&navigate=yes" target="_blank" rel="noopener">Ver en Waze</a></div>
      ${Object.keys(near).length ? `<div class="near-lists">${Object.entries(near).map(([k, list]) => `<div><h3>${esc(k)}</h3><ol>${list.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`).join('')}</div>` : ''}
    </div>
  </section>` : ''}

  ${forSale().some(x => x.slug !== p.slug) ? `<section class="block"><div class="wrap-wide"><div class="sec-head"><div><p class="eyebrow">Proyectos en venta</p><h2 class="title">Otros proyectos</h2></div><a class="link-arrow" href="/proyectos.html">Ver todos</a></div><div class="cards" id="others"></div></div></section>` : ''}
  <section class="talk" id="contacto">
    <div class="wrap talk-grid">
      <div class="talk-head">
        <p class="eyebrow">Contacto</p>
        <h2 class="talk-title">Quiero<br><span class="talk-word" id="talk-word">saber más</span><span class="talk-caret" aria-hidden="true"></span></h2>
        <div class="talk-direct" id="talk-direct"></div>
      </div>
      <div class="talk-box" id="talk"></div>
    </div>
  </section>`;

mountReel();
mountTalk(document.getElementById('talk'), document.getElementById('talk-word'), document.getElementById('talk-direct'), done ? '' : p.name);
const uf = document.getElementById('unit-filter'), uv = document.getElementById('unit-view');
const wire = (root) => root.querySelectorAll('[data-wa]').forEach(a => { a.href = waLink(a.dataset.wa); a.target = '_blank'; a.rel = 'noopener'; });
const pd = document.getElementById('pf-detail');
const pick = (btn) => { el.querySelectorAll('.ix').forEach(x => x.toggleAttribute('aria-current', x === btn)); const it = items[+btn.dataset.i]; uv.innerHTML = plateHtml(it); pd.innerHTML = specsHtml(it); [uv, pd].forEach(n => { n.classList.remove('swap'); void n.offsetWidth; n.classList.add('swap'); }); wire(pd); };
el.querySelectorAll('.ix').forEach(b => b.addEventListener('click', () => pick(b)));
uv?.addEventListener('click', e => { const g = e.target.closest('polygon[data-j]'); if (g) el.querySelector(`.ix[data-i="${dwgs.length + units.length + +g.dataset.j}"]`)?.click(); });
document.getElementById('pf-detail')?.addEventListener('click', async e => { const b = e.target.closest('.pf-share'); if (!b) return; const url = location.href.split('#')[0] + '#planos';
  try { if (navigator.share) await navigator.share({ title: p.name, url }); else { await navigator.clipboard.writeText(url); b.textContent = 'Enlace copiado'; setTimeout(() => b.textContent = 'Compartir', 1800); } } catch (_) {} });
if (uf) uf.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; uf.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const vis = [...el.querySelectorAll('.ix[data-beds]')].filter(x => { const show = !b.dataset.b || x.dataset.beds === b.dataset.b; x.parentElement.hidden = !show; return show; });
  if (vis.length) pick(vis[0]); });
const others = document.getElementById('others'); if (others) others.innerHTML = forSale().filter(x => x.slug !== p.slug).slice(0, 3).map(projectCard).join('');
el.querySelectorAll('[data-wa]').forEach(a => { a.href = waLink(a.dataset.wa); a.target = '_blank'; a.rel = 'noopener'; });
})();
</script>
</body>
</html>
