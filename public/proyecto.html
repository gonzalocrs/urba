<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyecto · Urba Inmobiliaria</title>
<meta name="description" content="Proyecto de Urba Inmobiliaria en Lima.">
<meta property="og:title" content="Proyecto · Urba Inmobiliaria">
<meta property="og:description" content="Proyecto de Urba Inmobiliaria en Lima.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#282829">
<link rel="icon" href="/img/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">


<link rel="preload" href="/fonts/bonn-bf-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-amarillo">
<header class="site-header" data-site-header></header>
<main>

<div id="project"></div>
</main>
<footer class="site-footer" data-site-footer></footer>
<script src="/projects.js"></script>
<script src="/site.js"></script>
<script>
(function(){
const p = PROJECTS.find(x => x.slug === new URLSearchParams(location.search).get('p'));
const el = document.getElementById('project');
if (!p) { el.innerHTML = '<section class="page-head band"><div class="wrap"><h1 class="title">Proyecto no encontrado</h1><p><a class="btn" href="/proyectos.html">Ver proyectos</a></p></div></section>'; return; }
document.body.className = 'theme-' + projectColor(p, PROJECTS.indexOf(p));
if (window.urbaInk) urbaInk(projectColor(p, PROJECTS.indexOf(p)));
document.title = p.name + ' · ' + p.district + ' · Urba Inmobiliaria';
document.querySelector('meta[name=description]').content = p.intro;
const ficha = (p.ficha || [
  ['ubicacion', 'Ubicación', p.address || p.district],
  ['pisos', 'Pisos', p.floors],
  ['areas', 'Áreas', p.areas],
  ['dorm', 'Dormitorios', bedroomsText(p.bedrooms).replace(' dorm.', '')],
  ['entrega', 'Entrega', p.delivery],
  ['precio', 'Precio desde', p.priceFrom]
]).filter(f => f[2]);
const I = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const icons = {
  ubicacion: I('<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>'),
  pisos: I('<path d="M4 21h16M6 21V4h12v17M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2"/>'),
  areas: I('<path d="M4 4h16v16H4z"/><path d="M4 9h5V4M15 20v-5h5"/>'),
  dorm: I('<path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 15h18M6 10V7h5v3M13 10V7h5v3M3 18v2M21 18v2"/>'),
  entrega: I('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l2 2M18 5l2 2"/>'),
  precio: I('<path d="M3 12l9-9h8v8l-9 9z"/><circle cx="16" cy="8" r="1.5"/>'),
  uso: I('<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>')
};
const units = p.units || [];
const bedsSet = [...new Set(units.map(u => u.beds))].sort((x, y) => x - y);
const money = v => v ? 'US$ ' + Number(v).toLocaleString('en-US') : 'Consultar';
const unitRow = (u, i) => `
  <li><button type="button" class="unit-pick" data-i="${i}" data-beds="${u.beds}"${i ? '' : ' aria-current="true"'}>
    <span class="u-code">${esc(u.code)}</span><span>${u.beds} dorm.</span><span>${u.area} m²</span><span class="u-price">${money(u.price)}</span>
  </button></li>`;
const unitView = (u) => `
  <div class="uv-plan">${u.plan ? `<img src="${esc(u.plan)}" alt="Plano del departamento ${esc(u.code)}">` : `<p>Plano del ${esc(u.code)}<br><small>disponible pronto</small></p>`}</div>
  <div class="uv-info">
    <div><p class="eyebrow">${esc(u.type || 'Flat')} · Piso ${esc(String(u.floor ?? '—'))}</p><h3>${esc(u.code)}</h3></div>
    <ul><li><span>Dorm.</span>${u.beds}</li><li><span>Baños</span>${u.baths}</li><li><span>Área</span>${u.area} m²</li><li><span>Precio</span>${money(u.price)}</li></ul>
    <a class="btn-pill btn-pill-dark" data-wa="Hola, me interesa el departamento ${esc(u.code)} de ${esc(p.name)} (${u.area} m², ${u.beds} dorm.).">Cotizar ${esc(u.code)} ↗</a>
  </div>`;
const near = p.nearby || {};
const mapsQ = encodeURIComponent(p.mapQuery || p.address || '');
const kind = (p.kicker || '').split('·')[0].trim(), year = ((p.kicker || '').split('·')[1] || '').trim();
const sub = [kind, p.district].filter(Boolean).join(' · ') + (year ? ', ' + year : '');
const done = p.stage === 'entregado';
// Renders + common areas reel: groups of images, three panels, story bars, name tabs
const reelGroups = (p.gallery || [
  ...(p.spaces || []).filter(x => x.img).map(x => ({ title: x.title, imgs: [x.img] })),
  ...(p.amenities || []).map(a => ({ title: a.title, imgs: a.imgs || [a.img || ''] }))
]).filter(g => g.imgs && g.imgs.length);
const reelFrames = reelGroups; // kept for the template check
function mountReel() {
  const box = document.getElementById('reel'); if (!box) return;
  const cap = document.getElementById('reel-cap'), tabs = document.getElementById('reel-tabs'), G = reelGroups.length;
  const show = Math.min(3, G), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let centre = 0, ticks = 0, timer = null, ks = [];
  box.style.setProperty('--n', show);
  tabs.innerHTML = reelGroups.map((g, gi) => `<button type="button" data-g="${gi}">${esc(g.title)}</button>`).join('');
  const first = () => show === 3 ? centre - 1 : centre;
  const panel = (gi, j) => { const g = reelGroups[gi], real = g.imgs.filter(Boolean);
    return `<figure class="reel-p${real.length ? '' : ' is-empty'}" data-j="${j}">`
      + (real.length ? real.map((img, k) => `<img class="${k ? '' : 'on'}" src="${esc(img)}" alt="${esc(g.title)}, ${esc(p.name)}" decoding="async">`).join('') : `<span>${esc(g.title)}<small>Render por completar</small></span>`)
      + `<div class="reel-bars">${Array.from({ length: Math.max(1, real.length) }, (_, k) => `<i class="${k ? '' : 'run'}"></i>`).join('')}</div></figure>`; };
  const render = () => {
    const gs = Array.from({ length: show }, (_, j) => ((first() + j) % G + G) % G);
    box.innerHTML = gs.map(panel).join(''); ks = gs.map(() => 0);
    const g = reelGroups[centre];
    cap.innerHTML = `<strong>${esc(g.title)}</strong><span>${esc(p.name)} · ${esc(p.district)}</span>`;
    tabs.querySelectorAll('button').forEach(b => b.toggleAttribute('aria-current', +b.dataset.g === centre));
  };
  // each panel steps through its own images; after a few steps the centre moves to the next group
  const tick = () => {
    ticks++;
    if (ticks >= Math.max(1, reelGroups[centre].imgs.filter(Boolean).length) && G > 1) return go(centre + 1);
    box.querySelectorAll('.reel-p').forEach((fg, j) => {
      const imgs = fg.querySelectorAll('img'), bars = fg.querySelectorAll('.reel-bars i'); if (imgs.length < 2) { bars[0].classList.remove('run'); void bars[0].offsetWidth; bars[0].classList.add('run'); return; }
      ks[j] = (ks[j] + 1) % imgs.length;
      imgs.forEach((im, k) => im.classList.toggle('on', k === ks[j]));
      bars.forEach((b, k) => { b.className = k < ks[j] ? 'on' : ''; if (k === ks[j]) { void b.offsetWidth; b.className = 'run'; } });
    });
  };
  const restart = () => { clearInterval(timer); if (!still) timer = setInterval(tick, 4500); };
  const go = (to) => { centre = (to + G) % G; ticks = 0; render(); restart(); };
  tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.g); });
  box.addEventListener('click', e => { const fg = e.target.closest('.reel-p'); if (!fg || show < 3) return go(centre + 1); const j = +fg.dataset.j; if (j !== 1) go(centre + j - 1); });
  box.addEventListener('mouseenter', () => clearInterval(timer)); box.addEventListener('mouseleave', restart);
  render(); restart();
}
el.innerHTML = `
  <section class="hero-photo">
    ${p.hero ? `<picture><source media="(max-width:720px)" srcset="${esc(p.heroMobile || p.hero)}"><img src="${esc(p.hero)}" alt="${esc(p.name)}" fetchpriority="high"></picture>` : ''}
    <div class="hero-photo-text">
      <p class="hero-kicker">${esc(done ? 'Obra entregada' : STAGES[p.stage])}</p>
      <h1>${esc(p.name)}</h1>
      <p class="hero-sub">${esc(sub)}</p>
      ${!done && (p.delivery || p.priceFrom || p.areas) ? `<p class="hero-keys">${[p.priceFrom && 'Desde ' + esc(p.priceFrom), bedroomsText(p.bedrooms) && esc(bedroomsText(p.bedrooms)), p.areas && esc(p.areas), p.delivery && 'Entrega ' + esc(p.delivery)].filter(Boolean).map(x => `<span>${x}</span>`).join('')}</p>` : ''}
      <div class="hero-actions"><a class="btn-pill" href="#contacto">${done ? 'Contáctanos' : 'Cotizar'}</a>${p.brochure ? `<a class="btn-pill btn-pill-ghost" href="${esc(p.brochure)}" download>Brochure</a>` : ''}<a class="btn-pill btn-pill-ghost" data-wa="Hola, quisiera información sobre ${esc(p.name)}.">WhatsApp</a></div>
    </div>
    <a class="scroll-cue" href="#proyecto">Descubre más<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
  </section>
  <section class="ficha-band" id="proyecto"><div class="wrap-wide">
    <p class="eyebrow">Ficha técnica</p>
    <ul class="ficha-list">${ficha.map(([k, t, v]) => `<li>${icons[k] || icons.uso}<span>${t}</span><strong>${v}</strong></li>`).join('')}</ul>
    ${(p.brochure || p.plans) ? `<div class="hero-actions left">${p.brochure ? `<a class="btn-pill btn-pill-dark" href="${esc(p.brochure)}" download>Descargar brochure</a>` : ''}${p.plans ? `<a class="btn-pill btn-pill-line" href="${esc(p.plans)}" download>Descargar planos</a>` : ''}</div>` : ''}
  </div></section>
  ${units.length ? `<section class="block" id="departamentos"><div class="wrap-wide">
    <div class="sec-head"><div><p class="eyebrow">Departamentos</p><h2 class="title">Elige tu departamento</h2></div>
      <div class="chips chips-light" id="unit-filter"><button type="button" data-b="" aria-pressed="true">Todos</button>${bedsSet.map(b => `<button type="button" data-b="${b}">${b} dorm.</button>`).join('')}</div></div>
    <div class="units-wrap">
      <div class="unit-view" id="unit-view">${unitView(units[0])}</div>
      <ul class="unit-list">${units.map(unitRow).join('')}</ul>
    </div>
  </div></section>` : ''}
  ${reelFrames.length ? `<section class="reel" id="renders" aria-label="Renders y áreas comunes"><div class="reel-panels" id="reel"></div><div class="reel-cap" id="reel-cap"></div><nav class="reel-tabs" id="reel-tabs"></nav></section>` : ''}
  ${(p.planImgs || []).length ? `<section class="block plans-band"><div class="wrap-wide">
    <div class="sec-head"><div><p class="eyebrow">Planos</p><h2 class="title">Distribución</h2></div></div>
    <div class="plans">${p.planImgs.map(x => `<figure><div><img src="${esc(x.img)}" alt="${esc(x.title)}" loading="lazy"></div><figcaption>${esc(x.title)}</figcaption></figure>`).join('')}</div>
  </div></section>` : ''}

  <section class="talk" id="contacto">
    <div class="wrap talk-grid">
      <div class="talk-head">
        <p class="eyebrow">Contacto</p>
        <h2 class="talk-title">Quiero<br><span class="talk-word" id="talk-word">saber más</span><span class="talk-caret" aria-hidden="true"></span></h2>
        <div class="talk-direct" id="talk-direct"></div>
      </div>
      <div class="talk-box" id="talk"></div>
    </div>
  </section>
  ${forSale().some(x => x.slug !== p.slug) ? `<section class="block"><div class="wrap-wide"><div class="sec-head"><div><p class="eyebrow">Proyectos en venta</p><h2 class="title">Otros proyectos</h2></div><a class="link-arrow" href="/proyectos.html">Ver todos</a></div><div class="cards" id="others"></div></div></section>` : ''}
  ${p.mapQuery ? `<section class="near" id="ubicacion">
    <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa de ${esc(p.name)}" src="https://www.google.com/maps?q=${mapsQ}&output=embed"></iframe>
    <div class="near-panel">
      <p class="eyebrow">Ubicación</p>
      <h2 class="title">Cerca de la vida que te gusta.</h2>
      <p class="near-addr">${esc(p.address || p.mapQuery)}</p>
      <div class="near-btns"><a class="btn-pill" href="https://www.google.com/maps/search/?api=1&query=${mapsQ}" target="_blank" rel="noopener">Ver en Google Maps</a><a class="btn-pill btn-pill-accent" href="https://waze.com/ul?q=${mapsQ}&navigate=yes" target="_blank" rel="noopener">Ver en Waze</a></div>
      ${Object.keys(near).length ? `<div class="near-lists">${Object.entries(near).map(([k, list]) => `<div><h3>${esc(k)}</h3><ol>${list.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`).join('')}</div>` : ''}
    </div>
  </section>` : ''}`;

mountReel();
mountTalk(document.getElementById('talk'), document.getElementById('talk-word'), document.getElementById('talk-direct'), done ? '' : p.name);
const uf = document.getElementById('unit-filter'), uv = document.getElementById('unit-view');
const wire = (root) => root.querySelectorAll('[data-wa]').forEach(a => { a.href = waLink(a.dataset.wa); a.target = '_blank'; a.rel = 'noopener'; });
const pick = (btn) => { el.querySelectorAll('.unit-pick').forEach(x => x.toggleAttribute('aria-current', x === btn)); uv.innerHTML = unitView(units[+btn.dataset.i]); uv.classList.remove('swap'); void uv.offsetWidth; uv.classList.add('swap'); wire(uv); };
el.querySelectorAll('.unit-pick').forEach(b => b.addEventListener('click', () => pick(b)));
if (uf) uf.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; uf.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const vis = [...el.querySelectorAll('.unit-pick')].filter(x => { const show = !b.dataset.b || x.dataset.beds === b.dataset.b; x.parentElement.hidden = !show; return show; });
  if (vis.length && !vis.some(x => x.hasAttribute('aria-current'))) pick(vis[0]); });
const others = document.getElementById('others'); if (others) others.innerHTML = forSale().filter(x => x.slug !== p.slug).slice(0, 3).map(projectCard).join('');
el.querySelectorAll('[data-wa]').forEach(a => { a.href = waLink(a.dataset.wa); a.target = '_blank'; a.rel = 'noopener'; });
})();
</script>
</body>
</html>
