<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyectos · Urba Inmobiliaria</title>
<meta name="description" content="Proyectos de Urba Inmobiliaria en Cusco y el Valle Sagrado.">
<meta property="og:title" content="Proyectos · Urba Inmobiliaria">
<meta property="og:description" content="Proyectos de Urba Inmobiliaria en Cusco y el Valle Sagrado.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#282829">
<link rel="icon" href="/img/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">


<link rel="preload" href="/fonts/bonn-bf-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-naranja">
<header class="site-header" data-site-header></header>
<main>

<section class="page-head band"><div class="iso" aria-hidden="true"></div><div class="wrap"><h1 class="title">Proyectos</h1><ol class="archive-index" id="archive-index"></ol></div></section>
<section class="wrap block-tight">
  <form class="filters" id="filters" aria-label="Filtrar proyectos"></form>
  <div class="cards" id="cards"></div>
  <p id="empty" class="muted" hidden>No encontramos proyectos con esos filtros.</p>
</section>
</main>
<footer class="site-footer" data-site-footer></footer>
<script src="/projects.js"></script>
<script src="/site.js"></script>
<script>if (forSale().length < 3) { document.getElementById('filters').hidden = true; const c = document.getElementById('cards'); const list = [...forSale(), ...delivered().filter(p => p.page !== false)]; c.className = 'features stack'; c.closest('section').classList.add('is-feature'); c.innerHTML = list.map(p => featureCard(p, 0)).join(''); c.querySelectorAll('[data-wa]').forEach(a => { a.href = waLink(a.dataset.wa); a.target = '_blank'; a.rel = 'noopener'; });
  // Archive index: one row per project, jumps to its panel (meant for walking through in meetings)
  const two = n => String(n).padStart(2, '0');
  document.getElementById('archive-index').innerHTML = list.map((p, i) => { const k = (p.kicker || '').split('·'); return `<li><a href="#p-${esc(p.slug)}"><span class="ai-n">${two(i + 1)}</span><strong>${esc(p.name)}</strong><span>${esc([k[0] && k[0].trim(), p.district].filter(Boolean).join(' · '))}</span><span class="ai-s">${esc(p.stage === 'entregado' ? (k[1] || 'Entregado').trim() : STAGES[p.stage])}</span></a></li>`; }).join('');
  c.querySelectorAll('.feature .eyebrow').forEach((e, i) => e.insertAdjacentHTML('afterbegin', `<span class="ai-n">${two(i + 1)}</span> `)); }
else mountFilters(document.getElementById('filters'), document.getElementById('cards'), forSale, document.getElementById('empty'));</script>
</body>
</html>
