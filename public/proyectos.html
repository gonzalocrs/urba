<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyectos · Urba Inmobiliaria</title>
<meta name="description" content="Proyectos de Urba Inmobiliaria en Cusco y el Valle Sagrado.">
<meta property="og:title" content="Proyectos · Urba Inmobiliaria">
<meta property="og:description" content="Proyectos de Urba Inmobiliaria en Cusco y el Valle Sagrado.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#282829">
<link rel="icon" href="/img/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">


<link rel="preload" href="/fonts/bonn-bf-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-naranja">
<header class="site-header" data-site-header></header>
<main>

<section class="page-head band"><div class="iso" aria-hidden="true"></div><div class="wrap"><h1 class="title">Proyectos</h1></div></section>
<section class="wrap block-tight">
  <form class="filters" id="filters" aria-label="Filtrar proyectos"></form>
  <div class="cards" id="cards"></div>
  <p id="empty" class="muted" hidden>No encontramos proyectos con esos filtros.</p>
</section>
</main>
<footer class="site-footer" data-site-footer></footer>
<script src="/projects.js"></script>
<script src="/site.js"></script>
<script>if (forSale().length < 3) { document.getElementById('filters').hidden = true;
  // Archive: same tiles as the home 'Obras entregadas' block, every project with a page
  const list = [...forSale(), ...delivered().filter(p => p.page !== false)], sec = document.getElementById('cards').closest('section');
  sec.className = 'obras archive'; sec.innerHTML = `<div class="wrap-wide"><div class="grid3">${list.map(p => { const k = (p.kicker || '').split('·'); const meta = [k[0] && k[0].trim(), p.district, p.stage === 'entregado' ? (k[1] || '').trim() : STAGES[p.stage]].filter(Boolean).join(' · ');
    return `<a class="g3" href="${projectUrl(p)}"><div class="g3-img"><img src="${esc(p.cover || p.hero)}" alt="${esc(p.name)}" loading="lazy"></div><p><strong>${esc(p.name)}</strong><span>${esc(meta)}</span></p></a>`; }).join('')}</div></div>`; }
else mountFilters(document.getElementById('filters'), document.getElementById('cards'), forSale, document.getElementById('empty'));</script>
</body>
</html>
